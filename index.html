<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Bites Restaurant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>☁️ Cloud Bites Diner</h1>
        <p>Serverless. Fast. Fresh.</p>
    </header>

    <main>
        <section id="menu">
            <h2>Our Menu</h2>
            <div class="menu-item">
                <h3>S3 Burger</h3>
                <p>Simple, scalable, layered beef burger with cheddar.</p>
                <span class="price">$10.99</span>
                <button onclick="addToCart('S3 Burger', 10.99)">Add to Cart</button>
            </div>
            <div class="menu-item">
                <h3>Lambda Fries</h3>
                <p>Crispy fries, cooked instantly on demand.</p>
                <span class="price">$4.50</span>
                <button onclick="addToCart('Lambda Fries', 4.50)">Add to Cart</button>
            </div>
        </section>

        <section id="cart-section">
            <h2>Your Order</h2>
            <ul id="cart-items"></ul>
            <div id="cart-total">Total: $0.00</div>
            <input type="text" id="customer-name" placeholder="Your Name" required>
            <button id="checkout-btn" onclick="submitOrder()">Place Order</button>
            <p id="status-message"></p>
        </section>
    </main>
</body>
</html>
